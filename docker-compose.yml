version: '3.8'

services:
  # Main AIBlockly application (API + UI)
  aiblockly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiblockly
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      # Mount for MCP server configurations (optional)
      - ./mcp-configs:/app/mcp-configs:ro
    networks:
      - aiblockly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Test MCP Server (for development/testing)
  test-mcp-server:
    build:
      context: ./test-mcp-server
      dockerfile: Dockerfile
    container_name: test-mcp-server
    networks:
      - aiblockly-network
    restart: unless-stopped
    profiles:
      - development
      - test

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: aiblockly-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ui/build:/usr/share/nginx/html:ro
    depends_on:
      - aiblockly
    networks:
      - aiblockly-network
    restart: unless-stopped
    profiles:
      - production

networks:
  aiblockly-network:
    driver: bridge
    name: aiblockly-network

volumes:
  mcp-data:
    driver: local
